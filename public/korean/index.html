<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#090b13"><title>한국어 아케이드 · みんなのゲームセンター</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/korean/korean.css"></head>
<body><main class="shell ko-shell"><header class="ko-nav"><a href="/">← 게임센터 <span lang="ja">ゲーム一覧</span></a><span id="connection" role="status">연결 중…</span></header>
<section id="setup"><div class="ko-heading"><div><span class="eyebrow">LANGUAGE ARCADE</span><h1>한국어, 한 판 더.</h1><p class="muted">문맥을 읽고, 표현을 고르고, 문장을 완성하세요.</p></div><button id="recordsBtn" class="btn secondary">내 기록</button></div>
<div id="cards" class="ko-cards"></div><section class="panel ko-setup"><div><span class="eyebrow">READY?</span><h2 id="selectedTitle">문맥 스나이퍼</h2><p id="rule"></p><p class="muted" id="pool"></p></div><div class="ko-controls"><label>플레이 방식<select id="mode"><option value="solo">Solo · 혼자</option><option value="vs">VS · 2–8명 경쟁</option><option value="coop">CO-OP · 2–8명 협력</option></select></label><label>난이도<select id="level"><option value="1">LEVEL 1 · TOPIK 3–4 중심</option><option value="2">LEVEL 2 · TOPIK 4–5 중심</option><option value="3">LEVEL 3 · TOPIK 5 중심</option><option value="4" selected>LEVEL 4 · TOPIK 5–6 중심</option><option value="5">LEVEL 5 · TOPIK 6 중심</option></select></label><label>미션 수<select id="count"><option value="5">5개</option><option value="10" selected>10개</option><option value="20">20개</option><option value="30">30개</option></select></label><label>이름<input id="name" maxlength="18" placeholder="플레이어" autocomplete="nickname"></label></div><div class="actions"><button id="create" class="btn primary">한 판 시작</button><button id="weakness" class="btn secondary">약점 다시하기 · Solo</button></div><p class="muted small-note">같은 판에서는 문제가 반복되지 않습니다. 선택한 난이도의 문항이 부족하면 실제 미션 수가 줄어듭니다. 난이도는 제작자 추정치입니다.</p></section>
<section class="ko-join"><label>친구 방 코드<input id="joinCode" maxlength="7" placeholder="K123ABC" autocomplete="off"></label><button id="join" class="btn secondary">참가하기</button><p class="muted">두 기기에서 같은 코드를 사용하세요. CO-OP은 함께 상의한 뒤 각자 답합니다.</p></section></section>
<section id="play" class="hidden"><div class="ko-heading"><div><span id="room" class="eyebrow"></span><h1 id="playTitle"></h1></div><button id="leave" class="btn secondary">나가기</button></div><div id="players" class="ko-players"></div><div class="ko-hud"><strong id="mission"></strong><span id="status" role="status"></span><strong id="clock"></strong></div><progress id="timebar" max="100" value="100" aria-label="남은 시간"></progress><div id="bossBar"></div><section id="surface" class="panel ko-surface" aria-live="polite"></section></section>
<section id="records" class="panel hidden"><div class="ko-heading"><h2>내 학습 기록</h2><button id="recordsClose" class="btn secondary">돌아가기</button></div><div id="recordBody"></div><button id="reviewAll" class="btn primary">틀린 문제 다시하기</button><p class="muted">기록은 이 브라우저에 저장됩니다. 기기 간 동기화는 지원하지 않습니다.</p></section>
<p id="error" class="error" role="alert"></p><noscript>게임을 하려면 JavaScript를 켜 주세요.</noscript></main><script src="/socket.io/socket.io.js"></script><script src="/korean/korean.js"></script></body></html>
