<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b13"><title>둘이 놀자 · 게임센터</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/korean/korean.css"><link rel="stylesheet" href="/duo/duo.css"></head><body><main class="shell ko-shell"><header class="ko-nav"><a href="/">← 게임센터</a><a href="/korean/">한국어 학습</a><span id="connection" role="status">연결 중…</span></header><section id="setup"><div class="ko-heading"><div><span class="eyebrow">TWO PLAYER ARCADE</span><h1>둘이 놀자.</h1><p class="muted">공부는 잠깐 쉬고, 설명하고 예측하고 웃는 한 판.</p></div></div><div id="cards" class="ko-cards"></div><section class="panel"><h2 id="selectedTitle"></h2><p id="rule"></p><div class="ko-controls"><label>내 이름<input id="name" maxlength="18" placeholder="플레이어"></label><label>라운드 수<select id="count"><option value="5">5라운드</option><option value="10">10라운드</option></select></label></div><button id="create" class="btn primary">둘이 할 방 만들기</button><p class="muted">각자 기기로 접속하고 같은 방 코드를 사용하세요. 두 사람만 참여합니다.</p></section><section class="ko-join"><label>친구 방 코드<input id="joinCode" maxlength="7" placeholder="D123ABC"></label><button id="join" class="btn secondary">참가하기</button></section></section><section id="play" class="hidden"><div class="ko-heading"><div><span id="room" class="eyebrow"></span><h1 id="title"></h1></div><button id="leave" class="btn secondary">나가기</button></div><div id="players" class="ko-players"></div><div class="ko-hud"><strong id="round"></strong><span id="status" role="status"></span><strong id="clock"></strong></div><section id="surface" class="panel ko-surface"></section></section><p id="error" class="error" role="alert"></p><noscript>JavaScript를 켜 주세요.</noscript></main><script src="/socket.io/socket.io.js"></script><script src="/duo/duo.js"></script></body></html>
